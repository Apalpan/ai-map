<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0E2A6B" />
  <link rel="preload" href="/fonts/plus-jakarta-sans/PlusJakartaSans-Regular.woff2" as="font" type="font/woff2"
    crossorigin />
  <link rel="preload" href="/fonts/plus-jakarta-sans/PlusJakartaSans-SemiBold.woff2" as="font" type="font/woff2"
    crossorigin />
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('ai-map-theme') || 'light';
        var resolvedTheme = savedTheme === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : savedTheme;
        document.documentElement.setAttribute('data-theme', resolvedTheme);
        document.documentElement.style.colorScheme = resolvedTheme;
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>
  <title>AI Map | Procesos claros, decisiones trazables</title>
  <meta name="description"
    content="Convierte texto, briefs y carpetas en mapas editables de procesos, decisiones, riesgos, evidencias y siguientes acciones." />
  <meta name="keywords"
    content="AI process map, mapa de procesos, gestion visual, decisiones, riesgos, evidencia, Mermaid, AEC, GEN+" />
  <link rel="canonical" href="https://ai-map-six.vercel.app/" />
  <link rel="icon" type="image/svg+xml" href="/ai-map-mark.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AI Map | Procesos claros, decisiones trazables" />
  <meta property="og:description"
    content="De informacion dispersa a un mapa editable con responsables, riesgos, evidencia y proximas acciones." />
  <meta property="og:url" content="https://ai-map-six.vercel.app/" />
  <meta property="og:image:alt" content="Vista previa de AI Map" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="AI Map | Procesos claros, decisiones trazables" />
  <meta property="twitter:description"
    content="Mapea procesos, decisiones, riesgos y evidencia desde texto o carpetas, con control humano." />
  <meta property="twitter:image:alt" content="Vista previa de AI Map" />

  <link rel="stylesheet" href="/src/index.css" />
</head>
